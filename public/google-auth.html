<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pamwill Google Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FAF8F5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      color: #1F1B16;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E4DDD2;
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(31, 27, 22, 0.08);
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      border-radius: 32px;
      margin: 0 auto 16px auto;
      border: 1px solid #E4DDD2;
      background: #F7EEDD;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #1F1B16;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 11px;
      font-weight: 700;
      color: #A9812F;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    p {
      font-size: 13px;
      color: #6B6259;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .google-btn {
      background: #FFFFFF;
      color: #1F1B16;
      border: 1.5px solid #E4DDD2;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(31, 27, 22, 0.04);
    }
    .google-btn:active {
      background: #F7EEDD;
      transform: scale(0.98);
    }
    .google-icon {
      width: 20px;
      height: 20px;
    }
    .status-area {
      margin-top: 18px;
      font-size: 13px;
      color: #A9812F;
      font-weight: 600;
      min-height: 20px;
    }
    .spinner {
      display: none;
      width: 28px;
      height: 28px;
      border: 3px solid #F7EEDD;
      border-top-color: #A9812F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <img src="/assets/pamwill-icon.png" alt="Pamwill" />
    </div>
    <h2>Sign in to Pamwill</h2>
    <div class="tagline">Boutique In-Home Wellness</div>
    <p>Choose your Google Account to securely access your personal wellness sanctuary.</p>

    <button id="google-btn" class="google-btn" onclick="triggerGoogleAuth()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

    <div id="spinner" class="spinner"></div>
    <div id="status" class="status-area">Tap to select Google account</div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDq_N_X6_v7-Uy-1a5LazM8hjRFp1L_J84",
      authDomain: "ai-projects-d261b.firebaseapp.com",
      projectId: "ai-projects-d261b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    window.triggerGoogleAuth = async function() {
      const btn = document.getElementById('google-btn');
      const spinner = document.getElementById('spinner');
      const status = document.getElementById('status');

      btn.style.opacity = '0.5';
      btn.style.pointerEvents = 'none';
      spinner.style.display = 'block';
      status.innerText = 'Connecting to Google Accounts...';

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        spinner.style.display = 'none';
        btn.style.display = 'none';

        const urlParams = new URLSearchParams(window.location.search);
        const baseRedirect = urlParams.get('redirect_uri') || '';

        const queryStr = 'name=' + encodeURIComponent(user.displayName || '') +
                         '&email=' + encodeURIComponent(user.email || '') +
                         '&photo=' + encodeURIComponent(user.photoURL || '') +
                         '&uid=' + encodeURIComponent(user.uid || '');

        const isTherapist = (baseRedirect && baseRedirect.includes('therapist')) || window.location.search.includes('therapist');
        const pamwillUrl = (isTherapist ? 'palwill-therapist://auth?' : 'pamwill://auth?') + queryStr;
        const expoUrl = 'exp://' + window.location.hostname + ':8081/--/auth?' + queryStr;
        const targetUrl = baseRedirect ? (baseRedirect + (baseRedirect.includes('?') ? '&' : '?') + queryStr) : pamwillUrl;

        status.innerHTML = `
          <div style="margin-top: 10px; animation: fadeIn 0.3s ease;">
            <div style="width: 52px; height: 52px; border-radius: 26px; background: #E8F5E9; color: #2E7D32; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 12px auto;">✓</div>
            <h3 style="font-size: 19px; font-weight: 700; color: #1F1B16; margin-bottom: 4px;">Authenticated!</h3>
            <p style="font-size: 13px; color: #6B6259; margin-bottom: 20px;">Welcome, <strong>${user.displayName || user.email}</strong></p>

            <a href="${targetUrl}" id="open-app-primary" style="display: block; background: #1F1B16; color: #FAF8F5; text-decoration: none; padding: 15px 20px; border-radius: 14px; font-weight: 700; font-size: 15px; margin-bottom: 10px; box-shadow: 0 4px 14px rgba(31,27,22,0.18);">
              Tap to Open App &rarr;
            </a>

            <a href="${expoUrl}" id="open-app-expo" style="display: block; background: #F7EEDD; color: #8A651E; text-decoration: none; padding: 13px 18px; border-radius: 12px; font-weight: 600; font-size: 13px; border: 1px solid #E4DDD2; margin-bottom: 12px;">
              Open in Expo Go App &rarr;
            </a>

            <a href="intent://auth?${queryStr}#Intent;scheme=pamwill;package=host.exp.exponent;end" style="display: inline-block; font-size: 12px; color: #A9812F; text-decoration: underline;">
              Alternative Android Intent Link
            </a>
          </div>
        `;

        // Automatic redirect attempt
        try {
          window.location.href = targetUrl;
        } catch (e) {
          console.warn('Auto redirect error:', e);
        }
      } catch (error) {
        spinner.style.display = 'none';
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';

        const isUnauthorizedDomain = error.code === 'auth/unauthorized-domain' || (error.message && error.message.includes('unauthorized-domain'));
        
        if (isUnauthorizedDomain) {
          status.innerHTML = `
            <div style="background: #FFF3CD; border: 1px solid #FFEAA7; border-radius: 12px; padding: 12px; margin-top: 14px; text-align: left; font-size: 12px; color: #856404;">
              <strong>⚠️ Firebase Domain Setup Required</strong><br/>
              To enable automatic Google popup, add <code>${window.location.hostname}</code> to <strong>Firebase Console &rarr; Authentication &rarr; Settings &rarr; Authorized domains</strong>.
            </div>
            <div style="margin-top: 18px; border-top: 1px solid #E4DDD2; padding-top: 16px;">
              <p style="font-size: 13px; font-weight: 600; color: #1F1B16; margin-bottom: 8px;">Or sign in with your Google account details directly:</p>
              <input id="manual-name" type="text" placeholder="Your Name" style="width: 100%; padding: 10px 14px; border: 1px solid #E4DDD2; border-radius: 10px; margin-bottom: 8px; font-size: 14px;" />
              <input id="manual-email" type="email" placeholder="your.google.account@gmail.com" style="width: 100%; padding: 10px 14px; border: 1px solid #E4DDD2; border-radius: 10px; margin-bottom: 12px; font-size: 14px;" />
              <button onclick="submitManualGoogle()" style="width: 100%; background: #1F1B16; color: #FAF8F5; border: none; border-radius: 10px; padding: 12px; font-weight: 600; cursor: pointer;">
                Continue with Google Profile &rarr;
              </button>
            </div>
          `;
        } else {
          status.innerText = error.message || 'Sign in was interrupted. Please try again.';
        }
      }
    };

    window.submitManualGoogle = function() {
      const nameInput = document.getElementById('manual-name');
      const emailInput = document.getElementById('manual-email');
      const name = nameInput ? nameInput.value.trim() : '';
      const email = emailInput ? emailInput.value.trim() : '';

      if (!email || !email.includes('@')) {
        alert('Please enter a valid Google email address.');
        return;
      }

      const returnUrl = 'pamwill://auth?name=' + encodeURIComponent(name || email.split('@')[0]) +
                        '&email=' + encodeURIComponent(email) +
                        '&photo=' + encodeURIComponent('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200') +
                        '&uid=' + encodeURIComponent('google-' + Date.now());

      window.location.replace(returnUrl);
    };

    // Auto-launch upon opening
    window.addEventListener('load', () => {
      setTimeout(() => {
        window.triggerGoogleAuth();
      }, 400);
    });
  </script>
</body>
</html>
